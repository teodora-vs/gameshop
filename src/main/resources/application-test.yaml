spring:
  datasource:

    url: jdbc:hsqldb:mem:testdb;sql.syntax_mys=true;sql.enforce_names=false
    driver-class-name: org.hsqldb.jdbc.JDBCDriver

    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.HSQLDialect
    hibernate:
      ddl-auto: create-drop

    defer-datasource-initialization: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_catalog:
        default_schema:

  sql:
    init:
      mode: never